    const arcPts = n => { const a = []; for (let i = 0; i < n; i++) { const t = i / (n - 1), u = 1 - t;
      a.push([u*u*24 + 2*u*t*60 + t*t*96, u*u*24 + 2*u*t*118 + t*t*24]); } return a; };
    const ringPts = (n, r, cx, cy) => { const a = []; for (let i = 0; i < n; i++) { const t = i / n * Math.PI * 2; a.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]); } return a; };

      if (/^(blouse|choli)$/.test(k)) return 'blouse';

      if (k === 'jacket') return 'jacket';
      if (/^(trousers|pyjama|suruwal|leggings)$/.test(k)) return 'pants';
      if (k === 'shorts') return 'shorts';

      if (k === 'jasmine') return 'jasmine';

      if (k === 'nath') return 'nath';
      if (k === 'kangri') return 'kangri';
      return 'necklace';

          g = dots(ringPts(24, 38, 60, 52), 6, [hsl(25, 70, 32), hsl(25, 65, 40)]) + '<circle cx="60" cy="96" r="7" fill="#b45309"/><path d="M60 100 V116" stroke="#dc2626" stroke-width="4"/>'; break;

        case 'bangles': {

          g = cols.map((cl, i) => '<circle cx="' + (34 + i * 13) + '" cy="60" r="27" fill="none" stroke="' + cl + '" stroke-width="6"/>').join(''); break; }
        case 'watch':
          g = '<rect x="46" y="6" width="28" height="108" rx="8" fill="#374151"/><circle cx="60" cy="60" r="27" fill="#fff" stroke="#94a3b8" stroke-width="6"/>' +
            '<path d="M60 60 V42 M60 60 L74 66" stroke="#111827" stroke-width="3" stroke-linecap="round"/>' + dots([[60,38],[82,60],[60,82],[38,60]], 2, ['#111827']); break;
        case 'jhumka': {
          const E = '<circle cx="55" cy="14" r="8" fill="' + GOLD + '"/><path d="M30 34 Q55 14 80 34 L86 66 Q55 78 24 66Z" fill="' + GOLD + '" stroke="' + GD + '" stroke-width="3"/>' +
            dots([[42,48],[55,44],[68,48],[48,58],[62,58]], 4, [hsl(hu, 75, 50), '#be123c']) + dots([[30,82],[42,86],[55,88],[68,86],[80,82]], 5, [hsl(hu, 75, 50), '#be123c']);
          g = '<g transform="translate(2,8) scale(.52)">' + E + '</g><g transform="translate(58,8) scale(.52)">' + E + '</g>'; break; }
        case 'anklet':
          g = '<path d="M18 36 Q60 108 102 36" fill="none" stroke="' + SIL + '" stroke-width="4"/>' + dots(arcPts(7).map(p => [p[0] * 0.875 + 7.5, p[1] * 0.75 + 18]), 6, [SIL, '#94a3b8']); break;
        case 'jasmine': {
          const fl = (x, y) => '<g transform="translate(' + x + ',' + y + ')">' + [0, 72, 144, 216, 288].map(a => '<ellipse cx="0" cy="-11" rx="6" ry="11" fill="#fff" stroke="#d1d5db" stroke-width="1" transform="rotate(' + a + ')"/>').join('') + '<circle r="4" fill="#fde68a"/></g>';
          g = '<ellipse cx="34" cy="86" rx="16" ry="7" fill="#15803d" transform="rotate(-25 34 86)"/><ellipse cx="86" cy="86" rx="16" ry="7" fill="#15803d" transform="rotate(25 86 86)"/><ellipse cx="60" cy="100" rx="16" ry="6" fill="#166534"/>' +

          g = '<ellipse cx="60" cy="78" rx="42" ry="24" fill="' + d + '"/><path d="M20 74 Q60 14 100 74 Q60 90 20 74Z" fill="' + c + '" stroke="' + d + '" stroke-width="2"/>' +

        case 'glasses':
          g = '<ellipse cx="38" cy="64" rx="24" ry="17" fill="#111827"/><ellipse cx="82" cy="64" rx="24" ry="17" fill="#111827"/><path d="M62 62 Q60 56 58 62" stroke="#111827" stroke-width="4" fill="none"/>' +
            '<path d="M14 60 L4 50 M106 60 L116 50" stroke="#111827" stroke-width="4"/><ellipse cx="30" cy="58" rx="7" ry="4" fill="rgba(255,255,255,.35)"/>'; break;

          g = '<path d="M20 24 Q60 44 100 24 L100 44 Q60 64 20 44 Z" fill="' + c + '" stroke="' + d + '" stroke-width="2"/><path d="M72 46 L90 108 H68 L56 52Z" fill="' + c + '" stroke="' + d + '" stroke-width="2"/>' +

        case 'beanie':
          g = '<path d="M24 74 Q24 26 60 26 Q96 26 96 74Z" fill="' + c + '" stroke="' + d + '" stroke-width="2"/><rect x="22" y="72" width="76" height="20" rx="4" fill="' + d + '"/>' +
            '<path d="M32 72 V92 M44 72 V92 M56 72 V92 M68 72 V92 M80 72 V92" stroke="' + l + '" stroke-width="2"/><circle cx="60" cy="22" r="8" fill="' + l + '" stroke="' + d + '"/>'; break;
        case 'topi':
          g = '<path d="M22 76 Q22 34 60 32 Q98 34 98 76Z" fill="' + c + '" stroke="' + d + '" stroke-width="2"/><rect x="18" y="72" width="84" height="14" rx="3" fill="' + d + '"/>' +
            dots([[40,60],[60,52],[80,60]], 3, [GOLD]); break;
        case 'kangri':
          g = '<path d="M26 56 Q26 106 60 106 Q94 106 94 56Z" fill="#b9772f" stroke="#7c4a14" stroke-width="2"/><ellipse cx="60" cy="56" rx="34" ry="9" fill="#ef4444"/>' +
            '<path d="M26 50 Q60 -2 94 50" fill="none" stroke="#7c4a14" stroke-width="4"/><path d="M34 70 H86 M32 84 H88" stroke="#7c4a14"/>'; break;
        default: {   // necklace family (kundan, temple, silver, pearl, turquoise, tilhari, kashmiri, perak ...)
          const bc = BEADS[key] || BEADS.necklace;
          g = dots(arcPts(15), 5, bc) + (/kundan|temple|tilhari|turquoise|kashmiri|perak/.test(key) ? '<circle cx="60" cy="76" r="9" fill="' + bc[0] + '" stroke="' + GD + '" stroke-width="2"/><circle cx="60" cy="76" r="4" fill="' + bc[1] + '"/>' : ''); }
      }
      return '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + key + '">' + g + '</svg>';
    }

    // ================= REAL PHOTOS (internet) — matches the item description =================
    // loremflickr.com gives a REAL Flickr photo matching the item keyword.
    // lock=<number> = same item always shows the SAME photo (no random change, no repeats across items).
    const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    const KW = { 'sungudi saree':'saree','kanchipuram saree':'saree','madisar saree':'saree','kovai cotton saree':'saree',
      'salem silk saree':'saree','nauvari saree':'saree','chikankari':'kurta','angrakha':'kurta','panjabi':'kurta','kediyu':'kurta',
      'dhuti':'dhoti','suruwal':'trousers','kunbi saree':'saree','kalamkari saree':'saree','paithani saree':'saree',
      'mysore silk saree':'saree','pochampally saree':'saree','tant saree':'saree','banarasi saree':'saree',
      'kasavu saree':'saree','sambalpuri saree':'saree','chanderi saree':'saree','kurti':'kurta','kameez':'kurta',
      'mangalsutra':'necklace','rudraksha':'rudraksha','jhumka':'jhumka','kolhapuri chappal':'sandals',
      'kanthi mala':'rudraksha','shakha':'bangles','oxidised':'jewellery','filigree':'jewellery','kashmiri':'jewellery',
      'perak':'necklace','tilhari':'necklace','khata':'scarf','dhaka':'cap','turquoise':'necklace',
      'jasmine':'jasmine flowers','kullu':'cap','kangri':'kashmiri kangri','goncha':'tibetan dress','pheran':'kashmiri pheran',
      'bakhu':'sikkim dress','kodava':'kodava dress','khasi':'khasi traditional dress','gunyu':'nepal traditional dress',
      'daura':'nepali daura','jymphong':'khasi dress','cholo':'nepal dress','chaniya':'ghagra','ghagra':'ghagra',
      'kurta':'kurta','veshti':'veshti','mundu':'mundu','dhoti':'dhoti','saree':'saree','turban':'turban',
      'sungudi':'saree','salwar kameez':'salwar kameez','sweater':'sweater','jacket':'jacket','trousers':'trousers',
      'pyjama':'pajama','shorts':'shorts','shirt':'shirt','blouse':'blouse','choli':'choli','leggings':'leggings',
      'sandal':'sandals','flip-flops':'flip flops','slide':'slides','hiking boots':'hiking boots','boot':'boots',
      'snow boots':'snow boots','mojari':'mojari','gold chain':'gold chain','ring':'ring','bracelet':'bracelet',
      'kara':'bracelet','wristwatch':'wristwatch','bangle':'bangles','temple jewellery':'temple jewellery',
      'silver':'silver necklace','pearl necklace':'pearl necklace','nath':'nath nose ring','anklet':'anklet',
      'scarf':'scarf','beanie':'beanie','sunglasses':'sunglasses','necklace':'necklace','kundan':'kundan jewellery' };
    const H2 = s => { let h = 7; for (const ch of s) h = (h * 33 + ch.charCodeAt(0)) >>> 0; return h; };
    function realImg(key, text, seed) {
      const kw = KW[key] || key;
      return 'https://loremflickr.com/420/420/' + encodeURIComponent(kw) + '?lock=' + (H2(seed + '|' + key + '|' + text) % 10000);
    }

    // ================= UI =================
    const citySel = document.getElementById('styleCity');
    Object.keys(C).forEach((c, i) => citySel.add(new Option((i + 1) + '. ' + c, c)));
    const clean = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    let runId = 0;

    document.getElementById('submitBtn').addEventListener('click', async function () {
      const city = citySel.value;
      if (!city) { alert("Please select a destination city first!"); return; }
      const gInput = document.querySelector('input[name="genderPref"]:checked');
      const gender = gInput ? gInput.value : "Men";
      const [ftype, men, women] = C[city];
      const loc = gender === "Men" ? men : women;
      const fw = FW[ftype][gender === "Men" ? "M" : "W"];

      const items = [
        { label: gender === "Men" ? "👕 Topwear" : "👚 Topwear", text: loc[0][0], key: loc[0][1] },
        { label: "👖 Bottomwear", text: loc[1][0], key: loc[1][1] },
        { label: fw[2], text: fw[0], key: fw[1] }
      ];
      loc[2].forEach(a => items.push({ label: '', text: a[0], key: a[1] }));
      const seed = city + gender;

      let html = '<div class="style-box"><div class="style-header"><h3>' + (gender === "Men" ? '👨' : '👩') +
        ' How ' + gender + ' dress in <u>' + city + '</u></h3></div><div class="outfit-grid">';
      items.slice(0, 3).forEach((it, i) => {
        html += '<div class="outfit-card"><div class="art" id="oc' + i + '">' + art(it.key, seed) + '</div>' +
          '<div class="outfit-info"><h4>' + it.label + '</h4><p>' + clean(it.text) + '</p></div></div>';
      });
      html += '<div class="outfit-card acc-card"><h4>💍 Accessories</h4><div class="acc-grid">';
      items.slice(3).forEach((it, k) => {
        html += '<div class="tile"><div class="art" id="oc' + (k + 3) + '">' + art(it.key, seed) + '</div><p>' + clean(it.text) + '</p></div>';
      });
      html += '</div></div></div>';
      const names = items.map(it => it.text);
      html += '<div class="predict">💡 <b>AI Prediction:</b> In ' + city + ', ' + gender.toLowerCase() + ' typically wear <b>' + clean(names[0]) + '</b> and <b>' +
        clean(names[1]) + '</b> with <b>' + clean(names[2]) + '</b>, and use ' + names.slice(3).map(n => '<b>' + clean(n) + '</b>').join(', ') + '.</div></div>';
      document.getElementById('styleContent').innerHTML = html;
      const resCard = document.getElementById('styleResultCard');
      resCard.classList.remove('hidden');
      resCard.scrollIntoView({ behavior: 'smooth' });

      // REAL PHOTO: loads from internet, matches the item description.
      // If the photo fails to load, the drawn picture stays as backup (so no empty box ever).
      const my = ++runId;
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        const box = document.getElementById('oc' + i);
        if (!box) continue;
        const url = realImg(it.key, it.text, seed);
        const im = new Image();
        im.onload = () => { if (my === runId) box.innerHTML = '<img loading="lazy" src="' + url + '" alt="' + clean(it.text) + '">'; };
        im.src = url;
      }
    });
  </script>
